name: Release

# On every push to main:
# - pending changesets: open or update the "Version Packages" PR;
# - versions in package.json not yet on npm (the version PR was merged): run every check, then
#   publish to npm with trusted publishing (OIDC, no token) and create tags and GitHub releases.
# npm's trusted publisher for each package must name this file (release.yml). See docs/RELEASING.md.

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mode:
    name: Select mode
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action/select-mode@v2
        id: mode
      # Publishing is off until the packages exist on npm and their trusted publishers are set
      # up (repository variable NPM_PUBLISH=enabled); the first release is published by hand.
      - if: steps.mode.outputs.mode == 'publish' && vars.NPM_PUBLISH != 'enabled'
        run: echo "::notice::Unpublished versions found, but NPM_PUBLISH is not 'enabled'; skipping publish. See docs/RELEASING.md."

  version:
    name: Open the version PR
    needs: mode
    if: needs.mode.outputs.mode == 'version'
    runs-on: ubuntu-latest
    permissions:
      contents: write # the version commit
      pull-requests: write # the version PR
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action/version@v2
        with:
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'

  check:
    name: Check before publishing
    needs: mode
    if: needs.mode.outputs.mode == 'publish' && vars.NPM_PUBLISH == 'enabled'
    runs-on: ubuntu-latest
    env:
      MONGOMS_VERSION: '8.0.32'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/cache@v6
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-${{ runner.os }}-${{ env.MONGOMS_VERSION }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  publish:
    name: Publish to npm
    needs: check
    runs-on: ubuntu-latest
    # Only this job can mint the OIDC token npm trusts; it runs no tests or other code.
    permissions:
      contents: write # tags and GitHub releases
      id-token: write # npm trusted publishing (and provenance)
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          # Trusted publishing needs Node 22.14+.
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: changesets/action/publish@v2
